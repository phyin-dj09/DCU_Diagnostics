name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test C Project
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            make \
            gcc \
            git \
            cmake \
            cppcheck \
            clang-format \
            libjansson-dev

      - name: Build and install Paho MQTT C
        run: |
          git clone https://github.com/eclipse-paho/paho.mqtt.c.git
          cd paho.mqtt.c
          git checkout v1.3.13
          cmake -Bbuild -H. \
            -DPAHO_WITH_SSL=FALSE \
            -DPAHO_BUILD_STATIC=FALSE \
            -DPAHO_BUILD_SHARED=TRUE
          cmake --build build
          cmake --install build
          ldconfig

      # - name: Check code formatting
      #   working-directory: Gateway_plugin
      #   run: |
      #     find . \( -name "*.c" -o -name "*.h" \) -print | xargs clang-format --dry-run --Werror

      # - name: Static analysis
      #   working-directory: Gateway_plugin
      #   run: |
      #     cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem \
      #       src \
      #       physoftware/dcu_diagnostics/src \
      #       physoftware/dcu_diagnostics/include \
      #       physoftware/Gateway-commissioning/src \
      #       physoftware/Gateway-commissioning/include

      - name: Clean build
        working-directory: Gateway_plugin
        run: make clean

      - name: Compile
        working-directory: Gateway_plugin
        run: make

      # - name: Run tests
      #   run: make test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-app-${{ github.sha }}
          path: |
            Gateway_plugin/*

      - name: Show generated files
        working-directory: Gateway_plugin
        run: |
          pwd
          ls -lah
          find . -type f
