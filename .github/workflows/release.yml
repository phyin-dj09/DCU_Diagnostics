name: Release - Package Binary

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Create Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc

      - name: Build release binary
        run: |
          make clean
          make

      - name: Prepare release package
        run: |
          mkdir -p release
          cp build/* release/
          echo "${{ github.ref_name }}" > release/VERSION
          sha256sum release/* > release/SHA256SUMS
          tar -czf c-app-${{ github.ref_name }}.tar.gz release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-app-${{ github.ref_name }}
          path: c-app-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: c-app-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
